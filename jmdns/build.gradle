            }
        }
    }
}

android {
    compileSdk configCompileSDK
    namespace nameSpace
    defaultConfig {
        minSdk configMinSDK
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }

        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    compileOptions {
        sourceCompatibility javaSDK
        targetCompatibility javaSDK
    }
    buildFeatures {}
    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}

dependencies {
    implementation project(':common')

//  这个版本版衣的时候会提D8 导致无法编译  implementation 'dnsjava:dnsjava:3.6.3'
